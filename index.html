<h2>Ce qui se joue en trois minutes</h2>
<h3>Être trouvé</h3><p>Avant d'appeler, un client vérifie. Sans site, il n'a rien à vérifier.</p>
<h3>Être choisi</h3><p>Il compare trois résultats, pas trente. Le référencement décide lesquels.</p>
<h3>Être appelé</h3><p>Photos, avis, bouton d'appel : il sait quoi faire en dix secondes.</p>
<h2>Un site qui travaille pour vous</h2>
<h3>Le prix le plus bas</h3><p>Je travaille seul, sans agence ni commerciaux. Vous payez le site, pas la structure.</p>
<h3>Les délais les plus rapides</h3><p>Votre site en ligne en six à huit jours, quand une agence en demande trois mois.</p>
<h3>100 % personnalisé</h3><p>Aucun modèle recyclé : votre métier, vos photos, vos mots, vos clients.</p>
<h2>De l'appel à la mise en ligne</h2>
<h3>Un appel de 20 minutes</h3><p>Votre métier, votre zone, ce que cherchent vos clients sur Google.</p>
<h3>Un devis ferme sous 24 h</h3><p>Périmètre, prix et date de mise en ligne sur le même document.</p>
<h3>La maquette avant le site</h3><p>Vous validez le design avant que le site existe.</p>
<h3>En ligne et référencé</h3><p>Nom de domaine, hébergement, fiche établissement Google, suivi des demandes.</p>
<h2>Avis clients</h2>
<h3>TL Menuiserie, Challans</h3><p>Le site correspond parfaitement à notre activité et nous avons apprécié l'accompagnement tout au long du projet. Très professionnel.</p>
<h3>SARL Leroy, Saint-Nazaire</h3><p>Très bonne expérience. Tout a été expliqué clairement et le résultat est propre, moderne et facile à utiliser.</p>
<h3>Joel D., Laval</h3><p>Très satisfait du résultat. Le site est moderne, professionnel et correspond parfaitement à ce que je voulais.</p>
<h2>Questions fréquentes</h2>
<h3>Combien de temps pour être en ligne ?</h3><p>Six à huit jours entre le versement de l'acompte et la mise en ligne.</p>
<h3>Le référencement est-il inclus ?</h3><p>Oui, dès la conception : pages construites sur les recherches de votre zone, site rapide, fiche établissement complète.</p>

document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;

    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked

    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;

      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }

      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];

        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;

    window.addEventListener('message', function (e) {
      const d = e.data;

      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;

0.55 0.07 75)\">\n            <div style=\"width:46px;height:46px;border-radius:999px;background:oklch(0.75 0.11 80);color:oklch(0.2 0.03 70);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700\">{{ p.icon }}<\u002Fdiv>\n            <div>\n              <div style=\"font-size:18px;font-weight:700;letter-spacing:-0.01em\">{{ p.title }}<\u002Fdiv>\n              <p style=\"font-size:15px;line-height:1.6;color:oklch(0.76 0.012 80);margin-top:8px\">{{ p.text }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"methode\" style=\"max-width:1200px;margin:0 auto;padding:clamp(52px,7vw,104px) 24px\">\n  <div data-reveal=\"1\" style=\"display:flex;align-items:baseline;gap:16px;flex-wrap:wrap\">\n    <span style=\"font-family:'Archivo',sans-serif;font-style:italic;font-weight:700;font-size:14px;letter-spacing:0.12em;color:oklch(0.55 0.09 75)\">03.<\u002Fspan>\n    <h2 style=\"font-family:'Archivo',sans-serif;font-style:italic;font-weight:800;font-size:clamp(28px,4.6vw,56px);line-height:1;letter-spacing:-0.035em;text-transform:uppercase\">De l'appel à la mise en ligne<\u002Fh2>\n  <\u002Fdiv>\n  <div data-reveal=\"1\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:clamp(20px,3vw,36px);margin-top:clamp(28px,4vw,48px);align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:10px\">\n      <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"4\">\n        <button sc-camel-on-click=\"{{ s.select }}\" style=\"display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;text-align:left;border:none;cursor:pointer;border-radius:16px;padding:18px 20px;transition:background 0.22s ease,transform 0.18s ease;background:{{ s.bg }};color:{{ s.fg }}\" style-hover=\"transform:translateX(3px)\">\n          <span style=\"font-family:'Archivo',sans-serif;font-weight:800       <div style=\"display:flex;flex-direction:column;gap:9px;margin-top:14px;flex:1\">\n                <sc-for list=\"{{ p.visibleFeatures }}\" as=\"f\" hint-placeholder-count=\"4\">\n                  <div style=\"display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline;font-size:14.5px;line-height:1.45\">\n                    <span style=\"color:{{ p.tickColor }};font-weight:700\">✓<\u002Fspan>\n                    <span>{{ f.t }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <button sc-camel-on-click=\"{{ p.toggleMore }}\" style=\"margin-top:14px;padding:11px;border-radius:10px;border:1px solid {{ p.ruleColor }};background:transparent;color:{{ p.mutedColor }};font-size:13.5px;font-weight:600;cursor:pointer;width:100%\">{{ p.moreLabel }}<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ openForm }}\" style=\"margin-top:10px;padding:15px;border-radius:12px;border:none;cursor:pointer;width:100%;font-size:15px;font-weight:600;background:{{ p.btnBg }};color:{{ p.btnFg }}\">Choisir cette formule<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ isDesktop }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:clamp(28px,3.5vw,48px)\">\n      <sc-for list=\"{{ plans }}\" as=\"p\" hint-placeholder-count=\"3\">\n        <div style=\"background:{{ p.bg }};color:{{ p.fg }};border-radius:22px;padding:clamp(24px,3vw,32px);display:flex;flex-direction:column;transition:transform 0.22s ease\" style-hover=\"transform:translateY(-5px)\">\n          <div style=\"min-height:20px;font-size:11.5px;font-weight:700;letter-spacing:0.13em;text-transform:uppercase;color:{{ p.badgeColor }}\">{{ p.badge }}<\u002Fdiv>\n          <div style=\"font-size:15.5px;font-weight:600;margin-top:8px\">{{ p.name }}<\u0 68 0.008 85);font-size:15px;transition:border-color 0.2s ease\" style-focus=\"border-color:oklch(0.68 0.11 80);outline:none\">\n            <sc-raw-select name=\"etat\" style=\"padding:14px 16px;border-radius:12px;border:1px solid oklch(0.89 0.012 82);background:oklch(0.968 0.008 85);font-size:15px\">\n              <option>Je n'ai pas de site<\u002Foption>\n              <option>J'ai un site qui ne rapporte rien<\u002Foption>\n              <option>Je veux surtout être mieux référencé<\u002Foption>\n              <option>Je me renseigne<\u002Foption>\n            <\u002Fsc-raw-select>\n            <textarea name=\"message\" rows=\"3\" placeholder=\"Votre projet en deux lignes\" style=\"padding:14px 16px;border-radius:12px;border:1px solid oklch(0.89 0.012 82);background:oklch(0.968 0.008 85);font-size:15px;resize:vertical;transition:border-color 0.2s ease\" style-focus=\"border-color:oklch(0.68 0.11 80);outline:none\"><\u002Ftextarea>\n            <sc-if value=\"{{ formError }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size:14px;line-height:1.5;color:oklch(0.48 0.15 30);background:oklch(0.94 0.03 30);border-radius:10px;padding:12px 14px\">{{ formError }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <button type=\"submit\" disabled=\"{{ sending }}\" style=\"margin-top:4px;padding:16px;border-radius:12px;border:none;background:oklch(0.21 0.012 60);color:oklch(0.97 0.008 85);font-size:16px;font-weight:600;cursor:pointer;transition:background 0.2s ease\" style-hover=\"background:oklch(0.3 0.03 70)\">{{ modalCta }}<\u002Fbutton>\n            <div style=\"font-size:12.5px;color:oklch(0.5 0.012 60);text-align:center\">Réponse sous 24 h · vos informations servent uniquement à vous répondre<\u002Fdiv>\n          <\u002Fform>\n          <\u002Fsc-if>\n\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showPricing&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;},&quot;showReviews&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;},&quot;calendarUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contenu&quot;},&quot;web3formsKey&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;fea83f91-3e74-41fd-a684-ecf889100110&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Formulaire&quot;}}\">\nclass Component extends DCLogic {\n  state = { faqOpen: 0, modal: null, sent: false, step: 0, tab: 'kora', billing: 'mois', isMobile: false, menuOpen: false, openPlans: {}, sending: false, formError: '', slots: {}, callFormat: 'Google Meet' };\n\n  componentDidMount() {\n    this.mq = window.matchMedia('(max-width: 860px)');\n    this.onMq = (e) => this.setState({ isMobile: e.matches, menuOpen: false });\n    this.setState({ isMobile: this.mq.matches });\n    if (this.mq.addEventListener) this.mq.addEventListener('change', this.onMq);\n    else this.mq.addListener(this.onMq);\n\n    this.bar = React.createRef && null;\n    this.sweepReveals = () => {\n      document.querySelectorAll('[data-reveal]').forEach((n) => {\n        if (n.style.opacity !== '0') return;\n        if (n.getBoundingClientRect().top < window.innerHeight) {\n          n.style.opacity = '1';\n          n.style.transform = 'none';\n          if (this.io) this.io.unobserve(n);\n        }\n      });\n    };\n    this.onScroll = () => {\n      const el = this.barEl;\n      if (el) {\n        const h = document.documentElement;\n        const max = h.scrollHeight - h.clientHeight;\n        el.style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0) + '%';\n      }\n      this.sweepReveals();\n    };\n    window.addEventListener('scroll', this.onScroll, { passive: true });\n    this.onScroll();\n\n    const nodes = Array.from(document.querySelectorAll('[data-reveal]'));\n    if (!('IntersectionObserver' in window) || !nodes.length) return;\n    nodes.forEach((n) => {\n      n.style.opacity = '0';\n      n.style.transform = 'translateY(18px)';\n      n.style.transition = 'opacity 0.6s cubic-bezier(0.2,0.7,0.3,1), transform 0.6s cubic-bezier(0.2,0.7,0.3,1)';\n    });\n    this.io = new IntersectionObserver((entries) => {\n      entries.forEach((e, i) => {\n        if (!e.isIntersecting) return;\n        const el = e.target;\n        setTimeout(() => { el.style.opacity = '1'; el.style.transform = 'none'; }, i * 70);\n        this.io.unobserve(el);\n      });\n    }, { rootMargin: '0px 0px -6% 0px', threshold: 0.06 });\n    nodes.forEach((n) => this.io.observe(n));\n    requestAnimationFrame(() => this.sweepReveals());\n    setTimeout(() => this.sweepReveals(), 400);\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this.onScroll);\n    if (this.mq) {\n      if (this.mq.removeEventListener) this.mq.removeEventListener('change', this.onMq);\n      else this.mq.removeListener(this.onMq);\n    }\n    if (this.io) this.io.disconnect();\n  }\n\n  renderVals() {\n    const stepData = [\n      { n: '01', time: '20 min', title: 'Un appel, sans devis à signer', text: \"On regarde ensemble votre métier, votre zone et ce que tapent vos clients sur Google.\", points: [{ t: \"Ce que cherchent les gens autour de vous\" }, { t: \"Ce que font vos concurrents visibles\" }, { t: \"Ce qui est réaliste, et ce qui ne l'est pas\" }] },\n      { n: '02', time: '24 h', title: 'Un devis ferme, écrit', text: \"Périmètre, prix et date de mise en ligne sur le même document. Rien ne bouge ensuite.\", points: [{ t: \"Prix fixe, pas de facturation à l'heure\" }, { t: \"Date de mise en ligne engagée\" }, { t: \"Acompte pour lancer, solde à la livraison\" }] },\n
